<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d405b">
  <title>The Great Dalmuti</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/js/main.js" defer></script>
</head>

<body class="min-h-screen">
  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
    class="hidden fixed bottom-4 left-1/2 z-50 w-[min(92vw,26rem)] -translate-x-1/2 rounded-md border border-gold-dark bg-royal px-4 py-3 text-center font-display font-semibold text-parchment shadow-banner">
    <span id="toast-message"></span>
  </div>

  <header class="heraldic">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-3 py-2">
      <h1 id="room-title" class="flex min-w-0 items-center gap-2 truncate font-display text-base font-bold text-gold-light sm:text-xl">
        <img src="/icons/crest.svg" alt="" class="h-7 w-6 shrink-0 sm:h-8 sm:w-7" aria-hidden="true">
        <span class="heraldic-title truncate">Room name</span>
      </h1>
      <div class="flex flex-wrap items-center justify-end gap-1.5">
        <!-- Language -->
        <div class="relative">
          <button id="lang-btn" type="button" class="icon-btn h-8 w-8" aria-haspopup="true" aria-expanded="false"
            title="Choose language" aria-label="Choose language">
            <img id="lang-btn-flag" src="/icons/flag-en.svg" alt="" width="22" height="15" class="menu-flag">
          </button>
          <div id="lang-menu" class="menu hidden" role="menu">
            <button type="button" class="menu-item" data-lang="en" role="menuitem">
              <img class="menu-flag" src="/icons/flag-en.svg" alt="">English
            </button>
            <button type="button" class="menu-item" data-lang="it" role="menuitem">
              <img class="menu-flag" src="/icons/flag-it.svg" alt="">Italiano
            </button>
            <button type="button" class="menu-item" data-lang="bg" role="menuitem">
              <img class="menu-flag" src="/icons/flag-bg.svg" alt="">Български
            </button>
          </div>
        </div>
        <button id="share-btn" type="button"
          class="icon-btn h-8 w-8" title="Share" aria-label="Share">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="M8.6 13.5 15.4 17.5 M15.4 6.5 8.6 10.5" />
          </svg>
        </button>
        <button id="fullscreen-btn" type="button" class="icon-btn h-8 w-8" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5" />
          </svg>
        </button>
        <button id="nickname" type="button"
          class="max-w-[6rem] truncate rounded-md border border-gold-dark bg-royal-light px-2 py-1.5 text-xs font-semibold hover:bg-royal sm:max-w-[9rem] sm:text-sm"
          title="Change nickname">Player</button>
      </div>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-4 px-2 py-3 lg:grid-cols-[1fr_20rem] lg:px-4">
    <!-- Table -->
    <section class="flex flex-col gap-2">
      <!-- Top seats -->
      <div class="grid grid-cols-4 gap-1 sm:gap-2">
        <div id="slot0" class="seat"><div id="role0" class="role-art"></div><div id="player0" class="seat-body"></div></div>
        <div id="slot1" class="seat"><div id="role1" class="role-art"></div><div id="player1" class="seat-body"></div></div>
        <div id="slot2" class="seat"><div id="role2" class="role-art"></div><div id="player2" class="seat-body"></div></div>
        <div id="slot3" class="seat"><div id="role3" class="role-art"></div><div id="player3" class="seat-body"></div></div>
      </div>

      <!-- Field -->
      <div class="table-felt mx-auto flex min-h-[150px] w-full flex-col items-center justify-center gap-1 px-3 py-4 sm:min-h-[190px]">
        <div id="turn-hint" class="hidden font-display text-lg font-bold text-gold-light"></div>
        <!-- Tax confirmation: a durable note (the toast can be missed during the
             instant auto-swap) that a Peon sees after paying tribute. -->
        <div id="tax-result" class="hidden panel-flex items-center gap-2 rounded border border-royal bg-royal/15 px-3 py-1 text-center font-bold text-gold-light">
          <span aria-hidden="true">⚖️</span>
          <span id="tax-result-text"></span>
        </div>
        <div id="who-played" class="font-display text-sm font-bold text-parchment/90 sm:text-base"></div>
        <div id="field-empty" class="hidden font-display text-sm italic text-parchment/60"></div>
        <div id="field-section" class="card-row flex items-end justify-center"></div>
      </div>

      <!-- Bottom seats -->
      <div class="grid grid-cols-4 gap-1 sm:gap-2">
        <div id="slot4" class="seat"><div id="role4" class="role-art"></div><div id="player4" class="seat-body"></div></div>
        <div id="slot5" class="seat"><div id="role5" class="role-art"></div><div id="player5" class="seat-body"></div></div>
        <div id="slot6" class="seat"><div id="role6" class="role-art"></div><div id="player6" class="seat-body"></div></div>
        <div id="slot7" class="seat"><div id="role7" class="role-art"></div><div id="player7" class="seat-body"></div></div>
      </div>

      <!-- Hand-finished banner: shown to the player who has gone out -->
      <div id="hand-finished" class="hand-finished hidden items-center justify-center gap-3 rounded-md border-2 border-gold bg-royal/20 px-4 py-3 text-center">
        <span aria-hidden="true">👑</span>
        <span id="hand-finished-text" class="font-display text-lg font-bold text-gold-light"></span>
      </div>

      <!-- Session-over banner: shown once a player reaches the target score -->
      <div id="session-over" class="session-over hidden items-center justify-center gap-3 rounded-md border-2 border-gold bg-royal/20 px-4 py-3 text-center">
        <span aria-hidden="true">🏆</span>
        <span id="session-over-text" class="font-display text-lg font-bold text-gold-light"></span>
        <button id="reset-session-btn" type="button" class="btn btn-herald hidden">Reset scores</button>
      </div>

      <!-- Revolution banner: flashes when a revolution is declared. The chat
           names the caller, this just declares it. -->
      <div id="revolution-banner" class="revolution-banner hidden items-center justify-center gap-3 rounded-md border-2 border-herald bg-herald/25 px-4 py-3 text-center">
        <span aria-hidden="true">⚔️</span>
        <span id="revolution-banner-text" class="font-display text-lg font-bold text-parchment"></span>
      </div>

      <!-- Hand -->
      <div class="frame bg-parchment-dark/40 p-2">
        <div id="hand" class="card-row flex min-h-[130px] flex-wrap items-end justify-center gap-y-3 py-1 sm:min-h-[170px]"></div>
      </div>

      <!-- Revolution prompt -->
      <div id="revolution-panel"
        class="hidden panel-flex items-center justify-center gap-3 rounded-md border border-herald bg-herald-light/30 px-4 py-3 text-center">
        <span id="revolution-text" class="font-semibold"></span>
        <button id="revolution-btn" type="button" class="btn btn-herald">Revolution</button>
      </div>

      <!-- Tax prompt -->
      <div id="tax-panel" class="hidden panel-flex flex-col gap-2 rounded-md border border-royal bg-royal/10 px-3 py-3">
        <div id="tax-title" class="text-center font-display font-bold"></div>
        <div id="tax-hand" class="card-row flex flex-wrap items-end justify-center gap-y-2"></div>
        <div class="text-center">
          <button id="tax-submit" type="button" class="btn btn-forest" disabled>Submit</button>
        </div>
      </div>

      <div id="spectator-list" class="text-center text-sm text-ink-soft"></div>

      <p id="select-hint" class="text-center text-xs text-ink-soft"></p>

      <!-- Controls -->
      <div
        class="sticky bottom-0 z-30 -mx-2 mt-1 flex flex-wrap items-center justify-center gap-2 border-t border-gold-dark/40 bg-parchment/95 px-2 py-2 backdrop-blur lg:static lg:border-0 lg:bg-transparent">
        <button id="play-btn" type="button" class="btn btn-herald flex-1 py-3 text-lg sm:flex-none sm:px-8">PASS</button>
        <button id="ready-btn" type="button" class="btn btn-forest py-3">READY</button>
        <button id="add-bot-btn" type="button" class="btn btn-royal hidden py-3">Add bot</button>
        <button id="home-btn" type="button" class="icon-btn h-11 w-11" title="Leave room" aria-label="Leave room">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11 12 3l9 8" />
            <path d="M5 10v10h14V10" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Chat & leaderboard -->
    <aside id="chat-panel" class="chat-panel panel p-3">
      <div class="flex items-center justify-between lg:hidden">
        <span class="font-display font-bold">Chat &amp; Score</span>
        <button id="chat-close" type="button" class="text-2xl leading-none" aria-label="Close">×</button>
      </div>
      <div id="chat-messages"
        class="scroll-fancy h-[42vh] overflow-y-auto break-words rounded-md border border-gold-dark/30 bg-parchment p-2 text-sm lg:h-[52vh]"></div>
      <div class="flex gap-2">
        <input id="message-input" class="input flex-1" type="text" autocomplete="off" placeholder="Write a message...">
        <button id="send-chat" type="button" class="btn btn-royal px-3">Send</button>
      </div>
      <div id="leaderboard" class="mt-2 border-t border-gold-dark/40 pt-2">
        <div id="leaderboard-title" class="text-center font-display font-bold">Leaderboard</div>
        <div id="session-score-title" class="text-center text-xs font-semibold text-gold-dark">Session score</div>
        <div id="statistics" class="mt-1 flex flex-col items-center"></div>
      </div>
    </aside>
  </main>

  <button id="chat-toggle" type="button"
    class="fixed bottom-24 right-3 z-30 rounded-full border border-gold-dark bg-royal px-4 py-3 font-display font-bold text-parchment shadow-banner lg:hidden">
    Chat
  </button>

  <!-- Add bot -->
  <dialog id="dlg-add-bot" class="modal">
    <form method="dialog" class="p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="add-bot-title" class="font-display text-xl font-bold">Add a bot</h2>
        <button id="dlg-add-bot-close" type="button" class="text-2xl leading-none" aria-label="Close">×</button>
      </div>
      <label id="bot-difficulty-label" class="field-label" for="bot-difficulty">Difficulty:</label>
      <select id="bot-difficulty" class="input">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <div id="bot-list" class="mt-3 text-sm"></div>
      <div class="mt-6 flex justify-end gap-2">
        <button id="fill-bots" type="button" class="btn btn-royal">Fill with bots</button>
        <button id="add-bot-confirm" type="button" class="btn btn-forest">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Share room -->
  <dialog id="dlg-share" class="modal">
    <form method="dialog" class="p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="share-title" class="font-display text-xl font-bold">Share Room</h2>
      </div>
      <label id="share-label" class="field-label" for="share-input">Share the room name:</label>
      <input id="share-input" class="input" type="text" readonly>
      <div class="mt-6 flex justify-end">
        <button id="share-close" type="button" class="btn btn-herald">Close</button>
      </div>
    </form>
  </dialog>

  <!-- Nickname / language -->
  <dialog id="dlg-nickname" class="modal">
    <form method="dialog" class="p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="nickname-title" class="font-display text-xl font-bold">Update your profile</h2>
        <button id="dlg-nickname-close" type="button" class="text-2xl leading-none" aria-label="Close">×</button>
      </div>
      <label id="nickname-label" class="field-label" for="nickname-input">Enter a new nickname:</label>
      <input id="nickname-input" class="input" type="text" autocomplete="off" maxlength="20">
      <div class="mt-6 flex justify-end">
        <button id="nickname-save" type="button" class="btn btn-forest">Save</button>
      </div>
    </form>
  </dialog>
</body>

</html>
