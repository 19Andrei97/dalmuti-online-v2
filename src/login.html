<!doctype html>
<html lang="en">

<head>
  <title>The Great Dalmuti - Sign in</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #1c2530; color: #eef2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #26323d; padding: 2rem; border-radius: 10px; width: min(92vw, 360px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 1rem; font-size: 1.4rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.6rem; border-radius: 6px; border: 1px solid #45525e; background: #1a232c; color: #eef2f5; }
    button { width: 100%; margin-top: 1.25rem; padding: 0.7rem; border: 0; border-radius: 6px; background: #4caf50; color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #546e7a; }
    .error { color: #ff8a80; margin-top: 0.75rem; min-height: 1.2em; font-size: 0.9rem; }
  </style>
</head>

<body>
  <div class="card">
    <h1>The Great Dalmuti</h1>
    <form id="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="20">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
      <button type="submit" id="login-btn">Log in</button>
      <button type="button" id="register-btn" class="secondary">Create account</button>
      <div class="error" id="auth-error"></div>
    </form>
  </div>

  <script src="./js/login.js"></script>
</body>

</html>
