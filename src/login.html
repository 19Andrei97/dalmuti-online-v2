<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d405b">
  <title>The Great Dalmuti - Sign in</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body class="flex min-h-screen items-center justify-center bg-royal p-4">
  <div class="panel w-[min(92vw,24rem)] bg-parchment p-6">
    <h1 class="font-display text-xl font-bold text-royal">The Great Dalmuti</h1>
    <form id="auth-form" class="mt-4">
      <label class="field-label" for="username">Username</label>
      <input id="username" name="username" class="input" autocomplete="username" required minlength="3"
        maxlength="20">
      <label class="field-label mt-3" for="password">Password</label>
      <input id="password" name="password" class="input" type="password" autocomplete="current-password" required
        minlength="8">
      <button type="submit" id="login-btn" class="btn btn-forest mt-5 w-full">Log in</button>
      <button type="button" id="register-btn" class="btn btn-royal mt-2 w-full">Create account</button>
      <p class="mt-3 min-h-[1.2em] text-sm text-herald" id="auth-error"></p>
    </form>
  </div>
  <script src="/js/login.js" defer></script>
</body>

</html>
