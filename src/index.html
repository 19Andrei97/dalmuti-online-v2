<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d405b">
  <title>The Great Dalmuti</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/js/main.js" defer></script>
</head>

<body class="min-h-screen">
  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
    class="hidden fixed bottom-4 left-1/2 z-50 w-[min(92vw,26rem)] -translate-x-1/2 rounded-md border border-gold-dark bg-royal px-4 py-3 text-center font-display font-semibold text-parchment shadow-banner">
    <span id="toast-message"></span>
  </div>

  <header class="border-b-4 border-gold bg-royal text-parchment shadow-banner">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
      <h1 class="font-display text-lg font-bold tracking-wide text-gold-light sm:text-2xl">
        <span aria-hidden="true">⚜</span> The Great Dalmuti
      </h1>
      <button id="nickname" type="button"
        class="max-w-[45%] truncate rounded-md border border-gold-dark bg-royal-light px-3 py-2 text-sm font-semibold hover:bg-royal sm:text-base"
        title="Change nickname">
        Player
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-6">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <button id="btn-create-room" type="button" class="btn btn-gold w-full py-3 text-lg">
        Create Room
      </button>
      <button id="btn-join-room" type="button" class="btn btn-herald w-full py-3 text-lg">
        Join Room
      </button>
    </div>

    <h2 id="lobby-title" class="mt-6 text-center font-display text-base font-semibold text-ink-soft">
      The Great Dalmuti
    </h2>

    <div id="room-list" class="mt-3 flex flex-col gap-2"></div>
  </main>

  <footer
    class="fixed inset-x-0 bottom-0 border-t border-gold-dark/50 bg-parchment-dark/95 px-4 py-2 text-center text-sm text-ink-soft backdrop-blur">
    <span id="info">Information</span>
    <a id="how-to-play" class="ml-2 font-semibold text-royal underline" href="/help">How to play?</a>
  </footer>

  <!-- Create room -->
  <dialog id="dlg-create" class="modal">
    <form method="dialog" class="p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="create-room-title" class="font-display text-xl font-bold">Create Room</h2>
        <button id="dlg-create-close" type="button" class="text-2xl leading-none" aria-label="Close">×</button>
      </div>
      <label id="new-room-name-label" class="field-label" for="new-room-name">Enter the room name:</label>
      <input id="new-room-name" class="input" type="text" autocomplete="off" maxlength="40">
      <label class="mt-4 flex items-center gap-2 font-body">
        <input id="hide-room" type="checkbox" class="h-4 w-4 accent-royal">
        <span id="hide-label">Private room</span>
      </label>
      <div class="mt-6 flex justify-end">
        <button id="create-room-confirm" type="button" class="btn btn-forest">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Join room -->
  <dialog id="dlg-join" class="modal">
    <form method="dialog" class="p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="join-room-title" class="font-display text-xl font-bold">Join Room</h2>
        <button id="dlg-join-close" type="button" class="text-2xl leading-none" aria-label="Close">×</button>
      </div>
      <label id="join-room-label" class="field-label" for="join-room-input">Enter room name:</label>
      <input id="join-room-input" class="input" type="text" autocomplete="off" maxlength="40">
      <div class="mt-6 flex justify-end">
        <button id="join-room-confirm" type="button" class="btn btn-forest">Join</button>
      </div>
    </form>
  </dialog>

  <!-- Nickname / language -->
  <dialog id="dlg-nickname" class="modal">
    <form method="dialog" class="p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="nickname-title" class="font-display text-xl font-bold">Update your profile</h2>
        <button id="dlg-nickname-close" type="button" class="text-2xl leading-none" aria-label="Close">×</button>
      </div>
      <label id="nickname-label" class="field-label" for="nickname-input">Enter a new nickname:</label>
      <input id="nickname-input" class="input" type="text" autocomplete="off" maxlength="20">
      <p id="choose-lang-label" class="field-label mt-4">Choose language:</p>
      <div class="flex gap-4">
        <a id="lang-en" class="lang-link cursor-pointer underline" data-lang="en">English</a>
        <a id="lang-it" class="lang-link cursor-pointer underline" data-lang="it">Italiano</a>
        <a id="lang-bg" class="lang-link cursor-pointer underline" data-lang="bg">Български</a>
      </div>
      <div class="mt-6 flex justify-end">
        <button id="nickname-save" type="button" class="btn btn-forest">Save</button>
      </div>
    </form>
  </dialog>
</body>

</html>
